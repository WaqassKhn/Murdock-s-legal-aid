services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: legallens
      POSTGRES_USER: legallens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U legallens -d legallens"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    init: true
    env_file: .env
    environment:
      LEGALLENS_DATABASE_URL: postgresql+psycopg://legallens:${POSTGRES_PASSWORD}@db:5432/legallens
      LEGALLENS_STORAGE_DIR: /var/lib/legallens/files
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - document_data:/var/lib/legallens
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
volumes:
  postgres_data:
  document_data:
