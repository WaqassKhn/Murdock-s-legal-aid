# Isolated local verification overlay; requires Compose >= 2.24.4 for !override.
services:
  app:
    image: legallens:verification
    env_file: !override
      - .clean-check/container.env
    ports: !override
      - "127.0.0.1:${LEGALLENS_VERIFY_PORT:-8010}:8000"
  tests:
    image: legallens:verification
    profiles: [verification]
    environment:
      LEGALLENS_DATABASE_URL: postgresql+psycopg://legallens:${POSTGRES_PASSWORD}@db:5432/legallens
      LEGALLENS_TEST_DATABASE_URL: postgresql+psycopg://legallens:${POSTGRES_PASSWORD}@db:5432/legallens
      LEGALLENS_STORAGE_DIR: /tmp/legallens-test-files
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, pytest, -q, -p, "no:cacheprovider"]
