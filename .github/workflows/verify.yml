name: Verify LegalLens
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: python -m ruff check backend evaluation scripts
      - run: python -m ruff format --check backend evaluation scripts
      - run: python -m pytest -q
        working-directory: backend
      - run: python evaluation/run.py
      - run: python -m pytest evaluation/test_evaluation.py -q
      - run: python scripts/benchmark.py
      - run: python scripts/submission_size.py
      - run: pip-audit
      - run: npm ci && npm audit && npm run lint && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser integration
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log) > /tmp/legallens-api.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1) > /tmp/legallens-web.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(3); urllib.request.urlopen('http://127.0.0.1:8000/health')"
          cd frontend && npm run test:e2e
      - name: Verify container, PostgreSQL and real OCR
        run: |
          python scripts/prepare_container_check.py
          docker build -t legallens:verification .
          docker compose --project-name legallens-check --env-file .clean-check/container.env -f compose.yaml -f compose.verify.yaml up -d app --wait
          docker compose --project-name legallens-check --env-file .clean-check/container.env -f compose.yaml -f compose.verify.yaml run --rm tests
          cd frontend && E2E_BASE_URL=http://127.0.0.1:8010 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            evaluation/report.json
            frontend/playwright-report
            frontend/test-results
