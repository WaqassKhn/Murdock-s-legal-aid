[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", ".uv-cache", ".clean-check"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/test_*.py" = ["F401", "F811"] # Fixtures imported from the shared API harness are used by pytest.
"evaluation/run.py" = ["E402"] # Resolve the backend package relative to this executable script.
"evaluation/live.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
